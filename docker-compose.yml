services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lextime-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LexTime!Dev2026"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - lextime-data:/var/opt/mssql
    healthcheck:
      # Container "started" and database "accepting queries" are different events.
      # This makes the difference visible to `docker compose ps`; the bootstrap script in
      # feature 002 still polls independently, because the container may be started by hand.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  lextime-data:
